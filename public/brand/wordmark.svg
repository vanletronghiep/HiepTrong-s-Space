    <path d="M450 181V135H472C501 135 501 161 472 161H450" />
    <path d="M613 135H661M637 135V181" />
    <path d="M729 181V135H750C779 135 779 160 750 160H729M749 160L775 181" />
    <path d="M869 135C837 135 837 181 869 181C901 181 901 135 869 135Z" />
    <path d="M964 181V135L1008 181V135" />
    <path d="M1115 143C1100 127 1070 134 1070 158C1070 182 1096 189 1115 174V160H1099" />
