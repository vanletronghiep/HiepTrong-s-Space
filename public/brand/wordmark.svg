      <stop offset=".2" stop-color="#A9CFFF" stop-opacity=".26" />
      <stop offset="1" stop-color="#A9CFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="soft-light" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>
  <g id="upper-glint" aria-hidden="true">
