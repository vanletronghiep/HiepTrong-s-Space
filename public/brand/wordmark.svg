<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" fill="none">
  <title>Hiep Trong Space</title>
  <desc>
    Thin geometric lettering with an open triangular A and two luminous four-point glints.
    Reconstructed from the owner's reference.
  </desc>
  <defs>
    <linearGradient
      id="letter-ink"
      x1="40"
      y1="140"
      x2="1120"
      y2="400"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#F4EFFF" />
      <stop offset=".45" stop-color="#FFFDF5" />
      <stop offset="1" stop-color="#DCE3F8" />
    </linearGradient>
    <linearGradient
      id="vertical-ray"
      x1="600"
      y1="0"
      x2="600"
      y2="113"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#A9CFFF" stop-opacity="0" />
      <stop offset=".44" stop-color="#F4EFFF" stop-opacity=".9" />
      <stop offset="1" stop-color="#A9CFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient
      id="horizontal-ray"
      x1="523"
      y1="49"
      x2="677"
      y2="49"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#A9CFFF" stop-opacity="0" />
      <stop offset=".5" stop-color="#F4EFFF" />
      <stop offset="1" stop-color="#A9CFFF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glint-halo">
